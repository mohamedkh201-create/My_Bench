; Notes:
; priority=1 --> Lower priorities indicate programs that start first and shut down last
; killasgroup=true --> send kill signal to child processes too

; graceful timeout should always be lower than stopwaitsecs to avoid orphan gunicorn workers.
[program:my-bench-frappe-web]
command=/home/mohamed/my_bench/env/bin/gunicorn -b 127.0.0.1:8000 -w 25 --max-requests 5000 --max-requests-jitter 500 -t 120 --graceful-timeout 30 frappe.app:application --preload
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/mohamed/my_bench/logs/web.log
stderr_logfile=/home/mohamed/my_bench/logs/web.error.log
stopwaitsecs=40
killasgroup=true
user=mahmoud
directory=/home/mohamed/my_bench/sites
startretries=10

[program:my-bench-frappe-schedule]
command=/usr/local/bin/bench schedule
priority=3
autostart=true
stdout_logfile=/home/mohamed/my_bench/logs/schedule.log
stderr_logfile=/home/mohamed/my_bench/logs/schedule.error.log
user=mahmoud
directory=/home/mohamed/my_bench
startretries=10



[program:my-bench-frappe-short-worker]
command=/usr/local/bin/bench worker --queue short,default
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/mohamed/my_bench/logs/worker.log
stderr_logfile=/home/mohamed/my_bench/logs/worker.error.log
user=mahmoud
stopwaitsecs=360
directory=/home/mohamed/my_bench
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10

[program:my-bench-frappe-long-worker]
command=/usr/local/bin/bench worker --queue long,default,short
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/mohamed/my_bench/logs/worker.log
stderr_logfile=/home/mohamed/my_bench/logs/worker.error.log
user=mahmoud
stopwaitsecs=1560
directory=/home/mohamed/my_bench
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10





[program:my-bench-redis-cache]
command=/usr/bin/redis-server /home/mohamed/my_bench/config/redis_cache.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/mohamed/my_bench/logs/redis-cache.log
stderr_logfile=/home/mohamed/my_bench/logs/redis-cache.error.log
user=mahmoud
directory=/home/mohamed/my_bench/sites
startretries=10

[program:my-bench-redis-queue]
command=/usr/bin/redis-server /home/mohamed/my_bench/config/redis_queue.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/mohamed/my_bench/logs/redis-queue.log
stderr_logfile=/home/mohamed/my_bench/logs/redis-queue.error.log
user=mahmoud
directory=/home/mohamed/my_bench/sites
startretries=10




[group:my-bench-web]
programs=my-bench-frappe-web




[group:my-bench-workers]
programs=my-bench-frappe-schedule,my-bench-frappe-short-worker,my-bench-frappe-long-worker




[group:my-bench-redis]
programs=my-bench-redis-cache,my-bench-redis-queue
